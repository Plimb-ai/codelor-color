name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,hf,train]"

      - name: Lint (ruff)
        run: ruff check codelor_color tests

      - name: Type check (mypy)
        run: mypy codelor_color

      - name: Tests (pytest)
        run: pytest

      - name: Termux-like smoke test (CPU, 1 thread, no workers, no Pillow path)
        env:
          TERMUX_VERSION: "ci"
        run: |
          codelor-color info
          codelor-color train --task background --max-steps 2 --img-size 32 \
            --dim 32 --depth 2 --heads 4 --tied-after 1 --out /tmp/smoke
          codelor-color train --task color --max-steps 2 --img-size 32 \
            --dim 32 --depth 2 --heads 4 --tied-after 1 --out /tmp/smoke-color

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the built wheel and import it
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          cd /tmp && python -c "import codelor_color as c; print(c.__version__, c.TASKS)"
          codelor-color --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publishes to PyPI only when tests + build passed on a push to main.
  # A version already on PyPI is skipped (bump codelor_color/_version.py to release).
  # Auth: PyPI "Trusted Publishing" (no secret needed) or, if you prefer,
  # a repository secret named PYPI_API_TOKEN.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codelor-color/
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: write   # to create the git tag / GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Read version and check whether it is already on PyPI
        id: version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'\"(.+)\"', open('codelor_color/_version.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/codelor-color/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already on PyPI: nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.version.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is not set -> Trusted Publishing is used.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Tag and create GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "$TAG" --notes "See CHANGELOG.md"
          fi
